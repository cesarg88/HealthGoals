name: iOS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ios-build-test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check format and lint with pinned tools
        run: |
          make setup
          make format-check lint
      - name: Prepare one iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcodebuild -version)" = $'Xcode 26.6\nBuild version 17F113'
          simulator_id=$(xcrun simctl create 'HealthGoals PR launch' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          echo "udid=$simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Test onboarding logic and launch on iPhone
        run: make test SIMULATOR_UDID='${{ steps.simulator.outputs.udid }}' RESULT_DIR="$RUNNER_TEMP/HealthGoalsVerify"
      - name: Analyze
        run: make analyze RESULT_DIR="$RUNNER_TEMP/HealthGoalsVerify"
      - name: Build release without signing
        run: make build-release RESULT_DIR="$RUNNER_TEMP/HealthGoalsVerify"
      - name: Clean up owned simulator
        if: always() && steps.simulator.outputs.udid != ''
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl delete "$SIMULATOR_UDID"
      - name: Preserve launch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-launch-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/HealthGoalsVerify/Tests.xcresult
          if-no-files-found: warn
          retention-days: 7
