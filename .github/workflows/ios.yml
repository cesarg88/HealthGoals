name: iOS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ios-build-test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build and test iPhone and iPad without signing
        run: scripts/test-ios.sh
      - name: Preserve test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-results-${{ github.event.pull_request.head.sha }}
          path: |
            .build/ios.*/*.log
            .build/ios.*/*.xcresult
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
