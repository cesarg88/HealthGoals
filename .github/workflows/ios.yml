name: iOS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ios-build-test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare one iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcodebuild -version)" = $'Xcode 26.6\nBuild version 17F113'
          simulator_id=$(xcrun simctl create 'HealthGoals PR launch' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          echo "udid=$simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Test launch on iPhone
        run: |
          xcodebuild test -project HealthGoals.xcodeproj -scheme HealthGoals \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -only-testing:HealthGoalsUITests/BootstrapTests/testLaunch \
            -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/HealthGoalsTests" \
            -resultBundlePath "$RUNNER_TEMP/Launch.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Analyze
        run: |
          xcodebuild analyze -project HealthGoals.xcodeproj -scheme HealthGoals \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/HealthGoalsTests" CODE_SIGNING_ALLOWED=NO
      - name: Build release without signing
        run: |
          xcodebuild build -project HealthGoals.xcodeproj -scheme HealthGoals \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/HealthGoalsRelease" CODE_SIGNING_ALLOWED=NO
      - name: Clean up owned simulator
        if: always() && steps.simulator.outputs.udid != ''
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl delete "$SIMULATOR_UDID"
      - name: Preserve launch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-launch-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/Launch.xcresult
          if-no-files-found: warn
          retention-days: 7
